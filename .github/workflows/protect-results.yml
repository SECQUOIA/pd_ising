name: Protect committed results

# Committed results record runs that cannot always be repeated. This check fails a
# pull request that modifies, deletes, or renames one. Adding a new result file is
# allowed. See .github/scripts/check_protected_paths.py for the rules.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  protect-results:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'allow-result-changes') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge base with the target branch is available.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for altered result and data files
        run: |
          git diff --name-status \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | python .github/scripts/check_protected_paths.py
