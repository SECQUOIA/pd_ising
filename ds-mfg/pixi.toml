[workspace]
name = "ds-mfg"
version = "0.1.0"
description = "Drug Substance Manufacturing Flowsheet Optimization (DSMFG) case study"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
setup-julia = "juliaup add 1.11.5 && julia +1.11.5 --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.status()'"
instantiate-julia = "julia +1.11.5 --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.status()'"
verify-python = "python -c 'import dimod, neal, minorminer, scipy, pyomo, pandas, numpy, networkx, matplotlib'"

# Default environment: Discrete IP and QUBO optimization stack (ds-mfg/discrete_ip/)
# Note: conda-forge's `julia` feedstock has no 1.11.x builds (it jumps from 1.10.4 to 1.12.1),
# so `juliaup` is locked here and `pixi run setup-julia` provisions Julia 1.11.5.
[dependencies]
python = "3.12.*"
juliaup = "==1.19.9"
numpy = "==1.26.4"
pandas = "==2.2.2"
scipy = "==1.13.1"
matplotlib = "==3.8.4"
networkx = "==3.3"
pyomo = "==6.9.2"
jupyter = "==1.1.1"
ipykernel = "==6.29.5"
python-dateutil = ">=2.7,<3"
pip = "*"

[pypi-dependencies]
dimod = "==0.12.20"
dwave-neal = "==0.6.0"
dwave-system = "==1.31.0"
dwave-networkx = "==0.8.17"
minorminer = "==0.2.18"
gurobipy = "==12.0.3"

# Simulation environment: Downstream PharmaPy flowsheet simulation stack (ds-mfg/simulation/)
# Note: External dependencies not available as pinned conda-forge/PyPI packages for this stack:
#   1. PharmaPy (external Git checkout as of 2022-09-29, https://github.com/CryPTSys/PharmaPy):
#      install into this environment via `pixi run -e simulation pip install --no-build-isolation -e /path/to/PharmaPy`
#   2. PyNomad (NOMAD 3.9.1 Python binding, used only by nomad_opt.py for blackbox optimization):
#      build against the NOMAD 3.9.1 C++ library if re-running blackbox NOMAD searches.
[feature.simulation.dependencies]
python = "==3.8.13"
assimulo = "==3.2.9"
cyipopt = "==1.1.0"
ampl-mp = "==3.1.0"
ipopt = "==3.14.4"
sundials = "==5.8.0"
numpy = "==1.22.3"
scipy = "==1.8.0"
pandas = "==1.4.2"
matplotlib = "==3.5.1"
networkx = "==2.7.1"
beautifulsoup4 = "==4.11.1"
lxml = "==4.8.0"
openpyxl = "==3.0.9"
pyyaml = "==6.0"
sympy = "==1.10.1"
tabulate = "==0.8.9"
pip = "*"

[feature.simulation.pypi-dependencies]
numdifftools = "==0.9.40"

[environments]
default = { solve-group = "default" }
simulation = { features = ["simulation"], no-default-feature = true, solve-group = "simulation" }
